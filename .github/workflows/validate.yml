name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.296

      # Strict mode fails on warnings the runtime would tolerate. Check the
      # marketplace, the plugin manifest and every skill and command.
      - name: Validate marketplace, plugin, skills and commands
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills
          claude plugin validate --strict commands
